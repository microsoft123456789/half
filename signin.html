<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | half.</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#f6f4ff,#ece7ff);margin:0;display:flex;justify-content:center;align-items:center;height:100vh;color:#222;}
.container{background:white;padding:34px;border-radius:14px;box-shadow:0 14px 36px rgba(69,28,126,0.16);width:360px;}
h1{color:#6a0dad;margin:0 0 10px 0;font-size:30px;}
.subtitle{margin:0 0 24px 0;color:#666;font-size:14px;}
.field{margin-bottom:14px;}
label{display:block;font-size:13px;font-weight:bold;color:#555;margin-bottom:6px;}
input{width:100%;padding:11px;border:1px solid #d8cfff;border-radius:8px;font-size:14px;box-sizing:border-box;}
input:focus{outline:none;border-color:#6a0dad;box-shadow:0 0 0 2px rgba(106,13,173,.15);}
.primary-btn,.google-btn{border:none;padding:12px 16px;font-size:15px;border-radius:8px;cursor:pointer;width:100%;font-weight:bold;}
.primary-btn{background:#6a0dad;color:white;margin-top:4px;}
.primary-btn:hover{background:#5b0896;}
.divider{text-align:center;color:#999;font-size:12px;margin:16px 0;position:relative;}
.divider:before,.divider:after{content:"";position:absolute;top:50%;width:38%;height:1px;background:#ece3ff;}
.divider:before{left:0;}
.divider:after{right:0;}
.google-btn{background:#fff;color:#6a0dad;border:1px solid #cbb6f3;}
.google-btn:hover{background:#f8f3ff;}
.signup{margin-top:16px;text-align:center;font-size:13px;color:#666;}
.signup a{color:#6a0dad;text-decoration:none;font-weight:bold;}
.signup a:hover{text-decoration:underline;}
#welcome{margin-top:14px;font-size:14px;color:#333;text-align:center;min-height:18px;}
</style>
</head>
<body>
<div class="container">
<h1>Sign in</h1>
<p class="subtitle">Welcome back to half. Enter your account details to continue.</p>

<div class="field">
<label for="username">User</label>
<input id="username" type="text" placeholder="Enter your username or email">
</div>

<div class="field">
<label for="password">Password</label>
<input id="password" type="password" placeholder="Enter your password">
</div>

<button id="emailSignInBtn" class="primary-btn">Sign In</button>

<div class="divider">or</div>
<button id="googleSignInBtn" class="google-btn">Sign in with Google</button>

<p class="signup">Don't have an account? <a href="signup.html" id="signUpLink">Click here to sign up</a></p>
<div id="welcome"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getAnalytics, isSupported as isAnalyticsSupported } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";

const firebaseConfig = {
  apiKey: "AIzaSyAg8rMH-z6Z4XivTjh-5xUhtxAditPCTcc",
  authDomain: "half-store.firebaseapp.com",
  projectId: "half-store",
  storageBucket: "half-store.firebasestorage.app",
  messagingSenderId: "478108258191",
  appId: "1:478108258191:web:47cf56d4a7f4249ef245fa",
  measurementId: "G-G5PLST39WR"
};

const app = initializeApp(firebaseConfig);

isAnalyticsSupported().then(supported => {
  if (supported) {
    getAnalytics(app);
  }
});

const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const emailSignInBtn = document.getElementById("emailSignInBtn");
const googleBtn = document.getElementById("googleSignInBtn");
const welcomeDiv = document.getElementById("welcome");

emailSignInBtn.addEventListener("click", () => {
  alert("Email/password sign-in is not enabled yet. Please use Sign in with Google.");
});

googleBtn.addEventListener("click", () => {
  signInWithPopup(auth, provider)
    .then(result => {
      welcomeDiv.innerText = `Hello, ${result.user.displayName}! You are signed in.`;
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);
    })
    .catch(e => alert(`Sign in failed: ${e.message}`));
});

onAuthStateChanged(auth, user => {
  if (user) {
    welcomeDiv.innerText = `Hello, ${user.displayName}! You are signed in.`;
  }
});
</script>
</body>
</html>
